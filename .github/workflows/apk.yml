name: APK Olustur

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP Dosyasini Ac
        run: |
          unzip -o *.zip
          DIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$DIR" ] && [ "$DIR" != "." ]; then cp -rf "$DIR"/* .; fi
      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK Derle
        run: gradle assembleDebug
      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AnnemRehberi-APK
          path: app/build/outputs/apk/debug/*.apk
