name: APK Olustur

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP Dosyasini Ac
        run: |
          unzip -o *.zip
          if [ -d "AnnemRehberi" ]; then cp -rf AnnemRehberi/* .; fi
      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Gradle ile APK Derle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          arguments: assembleDebug
      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AnnemRehberi-APK
          path: app/build/outputs/apk/debug/*.apk
